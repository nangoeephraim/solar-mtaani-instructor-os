name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Swap Space (Prevents Vite OOM)
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 10

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Install Dependencies
      run: npm install --no-audit --no-fund --legacy-peer-deps --ignore-scripts

    - name: Build Web Application
      env:
        NODE_OPTIONS: "--max-old-space-size=4096"
      run: npm run build

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'zulu'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Sync Capacitor Android
      run: |
        npx cap sync android > capacitor_sync_error.log 2>&1

    - name: Build Android APK
      working-directory: android
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon --max-workers=2 > ../gradle_build_error.log 2>&1

    - name: Create Issue with Error Log
      if: failure()
      run: |
        ERROR_LOG=""
        if [ -f capacitor_sync_error.log ]; then
          ERROR_LOG=$(cat capacitor_sync_error.log)
        fi
        if [ -f gradle_build_error.log ]; then
          ERROR_LOG="$ERROR_LOG\n\nGradle Build Error:\n$(cat gradle_build_error.log)"
        fi
        
        payload=$(jq -n --arg title "Build Failure Log - SHA ${{ github.sha }}" --arg body "Here is the error log:\n\`\`\`\n$ERROR_LOG\n\`\`\`" '{title: $title, body: $body}')
        
        curl -s -X POST \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/${{ github.repository }}/issues \
          -d "$payload"
