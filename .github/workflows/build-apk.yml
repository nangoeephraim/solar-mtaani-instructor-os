name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Swap Space (Prevents Vite OOM)
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 10

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm install --no-audit --no-fund --legacy-peer-deps --ignore-scripts

    - name: Build Web Application
      env:
        NODE_OPTIONS: "--max-old-space-size=4096"
      run: npm run build

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'zulu'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Sync Capacitor Android
      run: |
        npx cap sync android > capacitor_sync_error.log 2>&1

    - name: Build Android APK
      working-directory: android
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon --max-workers=2 > ../gradle_build_error.log 2>&1

    - name: Commit and Push Logs on Failure
      if: failure()
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add capacitor_sync_error.log gradle_build_error.log || true
        git commit -m "chore: upload build logs [skip ci]" && git push origin master || echo "No changes to commit"
