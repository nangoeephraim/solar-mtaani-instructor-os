name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  # These VITE_ vars are client-side only (browser-facing).
  # The Supabase anon key is intentionally public — protected by RLS, not secrecy.
  VITE_SUPABASE_URL: "https://qiyanhlrstbczzpmivnn.supabase.co"
  VITE_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFpeWFuaGxyc3RiY3p6cG1pdm5uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE3OTc2NTIsImV4cCI6MjA4NzM3MzY1Mn0.zLZW6IlCbZH2xb0zMxROFjWvlRZ1EWGiyYWeuuUZHV4"
  VITE_GOOGLE_CLIENT_ID: "1:579073691133:web:464261fda0e27444709d94"
  # GitHub Actions free runners have 7GB RAM total.
  # Capping Node at 3GB leaves headroom for the OS, Gradle, and other processes.
  NODE_OPTIONS: "--max-old-space-size=3072"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci --legacy-peer-deps

    - name: Build Web Assets
      # Override the package.json script which requests 8GB (crashes on 7GB runners).
      # Call vite directly with a safe 3GB limit instead.
      run: node --max-old-space-size=3072 node_modules/vite/bin/vite.js build

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Sync Capacitor Android
      run: npx cap sync android

    - name: Build Android APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon --max-workers=2

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: prism-app-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
